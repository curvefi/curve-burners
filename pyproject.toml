[tool.ruff]
line-length = 100
target-version = "py312"
# The legacy fee_keeper (brownie-era scripts and drafts) is kept as-is, unlinted.
extend-exclude = ["keepers/fee_keeper"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID252"]
ignore = [
    # Long strings and comments; ruff format wraps everything else.
    "E501",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["contracts", "keepers", "scripts", "tests"]
