[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID252"]
ignore = [
    # Long strings and comments; ruff format wraps everything else.
    "E501",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["contracts", "scripts", "tests"]
