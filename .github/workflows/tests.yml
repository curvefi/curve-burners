name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          python scripts/bootstrap_test_compilers.py

      - name: Run test suite (fork test excluded)
        run: python -m pytest tests/ -q --deselect tests/burners/test_dutch_auction_fork.py

  gnosis-fork:
    # Mandatory quality gate: REQUIRE_GNOSIS_FORK turns the missing-RPC skip
    # into a failure, so this job cannot go green without the fork actually
    # running. Configure the GNOSIS_RPC_URL repository secret.
    name: gnosis fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          python scripts/bootstrap_test_compilers.py

      - name: Run Gnosis fork test
        env:
          GNOSIS_RPC_URL: ${{ secrets.GNOSIS_RPC_URL }}
          REQUIRE_GNOSIS_FORK: "1"
        run: python -m pytest tests/burners/test_dutch_auction_fork.py -q
