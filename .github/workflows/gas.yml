name: gas

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: gas report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          python scripts/bootstrap_test_compilers.py

      - name: Measure head
        run: python scripts/gas_report.py --output .tmp/gas/head.json

      # The base of a pull request is measured with the head's scripts in a
      # worktree of the base commit, so the first pull request that adds the
      # tooling still gets a comparison. A base that fails to measure yields
      # a head-only report.
      - name: Measure base
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach .tmp/gas/base "${{ github.event.pull_request.base.sha }}"
          (cd .tmp/gas/base && python "$GITHUB_WORKSPACE/scripts/gas_report.py" \
            --output "$GITHUB_WORKSPACE/.tmp/gas/base.json") || echo "base measurement failed"
          git worktree remove --force .tmp/gas/base

      - name: Render report
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/compare_gas_report.py --head .tmp/gas/head.json \
              --base .tmp/gas/base.json --output .tmp/gas/report.md
          else
            python scripts/compare_gas_report.py --head .tmp/gas/head.json \
              --output .tmp/gas/report.md
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: |
            .tmp/gas/head.json
            .tmp/gas/report.md

      - name: Post report on the pull request
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gas-report
          path: .tmp/gas/report.md
