# auction_keeper configuration. Copy, fill in, run:
#   python -m keepers.auction_keeper run --config config.yaml
#
# Per network only `rpc` and `auctions` are required. `${NAME}` is expanded
# from the environment (~/.env is loaded first).

# Defaults for every network (each may override them).
poll_interval: 60       # seconds between node polls (the loop also wakes for the next order expiry)
order_ttl: 300          # order validity without a market estimate (or below it); reposted when it expires
# Market estimate behind the validity schedule: sources in priority order,
# the first with a price wins, cross-checked against the next one that has
# one. USD feeds: curve (prices.curve.finance), llama (coins.llama.fi),
# coingecko. Swap quotes for the exact lot: cow (orderbook /quote), kyber,
# velora, oneinch (needs pricing.oneinch_api_key_env; skipped without it).
# [] disables pricing (uniform order_ttl).
pricing:
  sources: [curve, llama, cow]
  cache: 60             # seconds a lot's estimate is reused
  cross_check: 0.25     # the winner must agree with the next source within 25%, else no market this round
  # chains: {curve: polygon, llama: polygon, coingecko: polygon-pos, kyber: polygon}  # defaults by chain id
  # coingecko_api_key_env: COINGECKO_API_KEY   # demo key; a pro key goes with
  # coingecko_url: https://pro-api.coingecko.com/api/v3
  # oneinch_api_key_env: ONEINCH_API_KEY
# Validity by distance of the curve quote from the market: one long order
# far above it (until the curve is due to enter the band, at most `max`),
# `min` inside the band (quote within near_above / near_below of the market).
ttl:
  near_above: 0.2
  near_below: 0.1
  min: 60               # the CoW orderbook minimum
  max: 7200
# Open orders per adapter at once; the lots farthest from the market wait.
# The CoW orderbook caps an owner's open outside-market orders at 10.
max_open_orders: 8
# The native rail: take lots through the AuctionTaker (auction_taker per
# network) with a Curve router swap, chunked by price impact; alongside the
# adapters. Sends only in mode keeper; offline simulates and reports.
native:
  enabled: false
  margin: 0.005         # take when the quote is this far under the Curve route quote
  max_impact: 0.01      # chunk so the route's price impact stays under 1%
  poll: 30              # poll this often while a lot is near its route quote
  # router: "0x..."     # Curve router NG; defaults by chain id
  # chain: fraxtal      # api.curve.finance slug; defaults by chain id
  # min_pool_usd: 1000
  # max_hops: 2
  # profit_receiver: "0x..."   # the sender by default
  # routes:             # explicit routes instead of the search
  #   "0xTOKEN": {path: ["0xTOKEN", "0xPOOL", "0xWANT"], params: [[0, 1, 1, 1, 2]]}
state_path: auction_keeper_state.json   # published orders and the LotStaged scan cursor
# offline (default): read the chain and post orders, never send a transaction.
# keeper: also send the on-chain housekeeping (executor allowance syncs); needs keeper_key_env.
mode: offline
# keeper_key_env: KEEPER_PRIVATE_KEY    # env var holding the key for keeper mode and custom takes

networks:
  ethereum:
    rpc: https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_TOKEN}
    auctions:
      - "0x0000000000000000000000000000000000000000"   # DutchAuctionBurner
    # Block to start the LotStaged scan from (the burner's deployment block).
    # Without it only lots staged after the keeper starts are discovered,
    # plus the whitelist.
    start_block: 21000000
    tokens:
      whitelist: []       # non-empty: sell only these tokens
      blacklist: []       # never sell these tokens
    # auction_taker: "0x..."   # AuctionTaker periphery for Executor.take_with_route
    cow:
      # orderbook_url: https://api.cow.fi/mainnet   # default by chain id
      # Full appData document whose keccak equals CowAdapter.app_data();
      # registered with the orderbook once (optional).
      # app_data_document: '{"appCode":"Curve","metadata":{},"version":"1.3.0"}'
    # The other rails are published whenever their adapter is active in the
    # registry; each rail's section (named after it) switches the rail off
    # (`enabled: false`), picks feed or log-only mode (`post`) and sets its
    # API key env var and URLs.
    uniswapx:                       # UniswapXAdapter
      enabled: true
      # The Uniswap order service takes only 65-byte ECDSA signatures on its own
      # quotes: orders are built, validated and logged for fillers. true also
      # attempts the POST and records the backend's rejection.
      post: false
      # order_service_url: https://api.uniswap.org/v2/order

  gnosis:
    rpc: https://lb.drpc.org/ogrpc?network=gnosis&dkey=${DRPC_API_KEY}
    auctions:
      - "0x0000000000000000000000000000000000000000"
    auction_taker: "0x0000000000000000000000000000000000000000"
    native:
      enabled: true       # no adapters here: the keeper fills lots on Curve itself
    poll_interval: 30
    order_ttl: 180
    pricing:
      sources: [cow, kyber, llama]   # this network trusts swap quotes first
    ttl:
      near_above: 0.3
    # mode: keeper
    # keeper_key_env: GNOSIS_KEEPER_KEY
